<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&family=Playfair+Display:wght@600;800&family=Inter:wght@400;600&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="shortcut icon" href="assets/icons/favicon.ico" type="image/x-icon">
    <title>RÉCIT</title>
</head>

<body>
    <header class="wrap">
        <a href="#" class="logo"><b>RÉCIT</b><span data-i18n="sub"></span></a>
        <nav><a href="#plays" data-i18n="n1"></a><a href="#stage" data-i18n="n2"></a><a href="#journal"
                data-i18n="n3"></a></nav>
        <div class="tools">
            <button class="ib" type="button" id="search"><svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="11" cy="11" r="6" />
                    <path d="M20 20l-4.2-4.2" />
                </svg></button>
            <button class="ib" type="button" id="lang"></button>
            <button class="ib lamp" type="button" id="theme" aria-pressed="false"><svg viewBox="0 0 24 24"
                    aria-hidden="true">
                    <path d="M12 2v4" />
                    <path d="M7 11l1.5-5h7L17 11z" />
                    <circle class="bulb" cx="12" cy="14" r="2.6" />
                    <g class="rays">
                        <path d="M5 18l-1.6 1.2M19 18l1.6 1.2M12 19.5V22" />
                    </g>
                </svg></button>
            <a class="ib" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram"><svg
                    viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5" />
                    <circle cx="12" cy="12" r="4" />
                    <circle cx="17.3" cy="6.7" r=".6" fill="currentColor" />
                </svg></a>
        </div>
    </header>

    <section class="hero wrap">
        <div class="tx"><span class="eb" data-i18n="eb"></span>
            <h1 class="hd"><span data-i18n="h1"></span><br><span data-i18n="h2"></span></h1>
            <p data-i18n="hs"></p>
            <div class="btns"><a class="btn" href="#plays" data-i18n="c1"></a><a class="btn o" href="#stage"
                    data-i18n="c2"></a></div>
        </div>
        <div class="ph po"> <img src="assets/images/hero.webp" alt="A theatre stage with the curtain open">
        </div>
    </section>

    <section class="s wrap" id="plays">
        <div class="sh">
            <h2 class="hd" data-i18n="ph"></h2><a href="#" data-i18n="all"></a>
        </div>
        <div class="mq">
            <div class="mq-track" id="plays-l"></div>
        </div>
    </section>
    <section class="s alt" id="stage">
        <div class="wrap">
            <div class="sh">
                <h2 class="hd" data-i18n="fh"></h2><a href="#" data-i18n="all"></a>
            </div>
            <div class="mq">
                <div class="mq-track" id="perf-l"></div>
            </div>
        </div>
    </section>
    <section class="s wrap" id="journal">
        <div class="sh">
            <div>
                <h2 class="hd" style="margin:0" data-i18n="jh"></h2><span class="mu" data-i18n="js"></span>
            </div><a href="#" data-i18n="all"></a>
        </div>
        <div class="mq">
            <div class="mq-track" id="j-l"></div>
        </div>
    </section>

    <footer>
        <div class="wrap">
            <div class="fg">
                <div class="fc" style="max-width:300px"><a href="#" class="logo"><b>RÉCIT.</b></a><span class="mu"
                        data-i18n="tag"></span></div>
                <div class="fc"><b data-i18n="f1"></b><a href="#plays" data-i18n="n1"></a><a href="#stage"
                        data-i18n="n2"></a><a href="#journal" data-i18n="n3"></a></div>
                <div class="fc"><b data-i18n="f2"></b><a href="#" data-i18n="a1"></a><a href="#" data-i18n="a2"></a><a
                        href="#" data-i18n="a3"></a></div>
                <div class="fc"><b>Instagram</b><a class="ib" href="https://www.instagram.com/" target="_blank"
                        rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" aria-hidden="true">
                            <rect x="3" y="3" width="18" height="18" rx="5" />
                            <circle cx="12" cy="12" r="4" />
                            <circle cx="17.3" cy="6.7" r=".6" fill="currentColor" />
                        </svg></a></div>
            </div>
            <div class="cp">© RÉCIT — Theatre &amp; Culture</div>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>

</html>
