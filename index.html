    <dialog class="auth" id="auth" aria-labelledby="auth-tabs">
        <div class="auth-curtain l" aria-hidden="true"></div>
        <div class="auth-curtain r" aria-hidden="true"></div>

        <button class="ib auth-close" type="button" id="auth-close">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M6 6l12 12M18 6L6 18" />
            </svg>
        </button>
        <div class="auth-tabs" id="auth-tabs">
            <button class="auth-tab" type="button" data-mode="login" aria-selected="true"
                data-i18n="authLogin"></button>
            <button class="auth-tab" type="button" data-mode="signup" aria-selected="false"
                data-i18n="authSignup"></button>
        </div>
        <form class="auth-form" id="auth-form" data-mode="login">
            <label class="only-signup"><span data-i18n="authName"></span>
                <input type="text" id="auth-name" name="name" autocomplete="name">
            </label>
            <label><span data-i18n="authEmail"></span>
                <input type="email" name="email" autocomplete="email" required>
            </label>
            <label><span data-i18n="authPass"></span>
                <input type="password" id="auth-pass" name="password" minlength="8" required>
            </label>
            <button class="btn only-login" type="submit" data-i18n="authGo1"></button>
            <button class="btn only-signup" type="submit" data-i18n="authGo2"></button>
            <p class="auth-note" id="auth-note" aria-live="polite"></p>
        </form>
    </dialog>
